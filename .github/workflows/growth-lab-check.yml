name: Growth Lab checks

on:
  push:
    paths:
      - "dashboard_v2/**"
      - ".github/workflows/growth-lab-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q app.py engine views tests
      - name: Test category promo rules
        run: python -m unittest discover -s tests -p 'test_growth_policy.py' -v
